<mat-toolbar class="app-toolbar">
    <mat-toolbar-row>
        <button mat-icon-button class="menu-btn" (click)="toggleSideBar()">
            <mat-icon>menu</mat-icon>
        </button>

        <div class="header-search">
            <mat-icon>search</mat-icon>
            <input type="text" placeholder="Search analytics, orders, or reports...">
        </div>

        <div class="toolbar-actions">
            <button mat-icon-button class="action-btn">
                <mat-icon>notifications</mat-icon>
            </button>
            <button mat-flat-button color="primary" class="export-btn">Export Report</button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item>
                    <mat-icon>manage_accounts</mat-icon>
                    Profile
                </button>
                <button mat-menu-item>
                    <mat-icon>exit_to_app</mat-icon>
                    Sign out
                </button>
            </mat-menu>
        </div>
    </mat-toolbar-row>
</mat-toolbar>
