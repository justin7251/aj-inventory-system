<div class="sidebar-shell">
    <div class="brand-row">
        <div class="brand-icon"><mat-icon>inventory_2</mat-icon></div>
        <span class="brand-text">AJ Fulfillment</span>
    </div>

    <mat-nav-list>
        <a class="side-menu" mat-list-item routerLinkActive="list-item-active" [routerLinkActiveOptions]="{exact:true}" routerLink="/">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
        </a>
        <a class="side-menu" mat-list-item routerLinkActive="list-item-active" routerLink="/order">
            <mat-icon>shopping_bag</mat-icon>
            <span>Orders</span>
        </a>
        <a class="side-menu" mat-list-item routerLinkActive="list-item-active" routerLink="/items">
            <mat-icon>inventory_2</mat-icon>
            <span>Inventory</span>
        </a>
        <a class="side-menu" mat-list-item routerLinkActive="list-item-active" routerLink="/packing">
            <mat-icon>local_shipping</mat-icon>
            <span>Shipping</span>
        </a>
        <a class="side-menu" mat-list-item routerLinkActive="list-item-active" routerLink="/integrations">
            <mat-icon>analytics</mat-icon>
            <span>Integrations</span>
        </a>
        <a class="side-menu muted" mat-list-item>
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
        </a>
        <a class="side-menu muted" mat-list-item>
            <mat-icon>help_outline</mat-icon>
            <span>Support</span>
        </a>
    </mat-nav-list>

    <div class="spacer"></div>

    <div class="profile-row">
        <div class="avatar">AJ</div>
        <div>
            <p>Alex Henderson</p>
            <small>Enterprise Admin</small>
        </div>

</div>
