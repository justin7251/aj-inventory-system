<div>
  <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <ng-container [matColumnDef]="columnKey" *ngFor="let columnKey of columnKeys">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ columnHeader[columnKey] }}</th>
      <td mat-cell *matCellDef="let element">
        <div>{{ element[columnKey] }}</div>
        <!-- <button mat-icon-button matTooltip="Click to Delete" class="iconbutton" (click)="delete(element.$key)" color="warn"> <mat-icon>delete</mat-icon></button> -->
      </td>
      </ng-container>


      
    
      <tr mat-header-row *matHeaderRowDef="columnKeys"></tr>
      <tr mat-row *matRowDef="let row; columns: columnKeys;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
</div>
